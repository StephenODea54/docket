[project]
name = "docket"
version = "0.1.0"
description = "TODO"
readme = "README.md"
authors = [
    { name = "Stephen O'Dea", email = "odeastephen1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.86",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "litellm>=1.99.0",
    "pydantic>=2.13.5",
    "sustained>=2.23.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
docket = "docket.cli:app"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
